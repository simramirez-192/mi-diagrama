spring.application.name=flota-aviones
server.port=8080

# ---- Base de datos H2 (archivo local: los datos persisten entre reinicios) ----
spring.datasource.url=jdbc:h2:file:./data/flotadb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Consola H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Alternativa PostgreSQL (comentar bloque H2 y descomentar dependencia en pom.xml) ----
# spring.datasource.url=jdbc:postgresql://localhost:5432/flotadb
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- Documentación OpenAPI / Swagger ----
# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
